name: Terraform AWS EC2 + ALB Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  terraform-apply:
    runs-on: ubuntu-latest

    env:
      TF_VAR_name_prefix: dynamicsite-lb
      TF_VAR_key_name: ''

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: cd terraform && terraform init

      - name: Terraform Validate
        run: cd terraform && terraform validate

      - name: Terraform Format Check
        run: cd terraform && terraform fmt -check -recursive || true

      - name: Terraform Plan
        id: plan
        run: cd terraform && terraform plan -out=tfplan

      - name: Run Checkov (informative)
        run: |
          cd terraform
          python3 -m pip install --quiet --break-system-packages checkov 2>/dev/null || python3 -m pip install --quiet --user checkov 2>/dev/null || true
          if command -v checkov >/dev/null 2>&1; then
            checkov -d . --framework terraform --exit-code 0 -o json > checkov-report.json || true
          else
            echo '{"note": "checkov nao instalado - scan ignorado"}' > checkov-report.json
          fi
          echo "checkov-completed=true" >> $GITHUB_OUTPUT

      - name: Upload Checkov Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: checkov-report
          path: terraform/checkov-report.json
          if-no-files-found: warn

      - name: Terraform Apply
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: cd terraform && terraform apply -auto-approve tfplan
